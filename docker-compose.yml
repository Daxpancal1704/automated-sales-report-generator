version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_report_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MAX_UPLOAD_SIZE_MB=15
      - DEFAULT_CURRENCY=INR
    volumes:
      - ./sample_data:/app/sample_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: sales_report_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
